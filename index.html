<script>
        // O SEGREDO DO SUCESSO ESTÁ AQUI: { preferCanvas: true }
        // Isso impede que seu navegador sofra combustão espontânea.
        const map = L.map('map', { preferCanvas: true }).setView([-15.7801, -47.9292], 5);

        L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            crossOrigin: true, 
            attribution: '© Google Maps'
        }).addTo(map);

        let ordemSelecao = 1;
        let talhoesSelecionados = [];
        let listaFazendas = new Set();
        let geojsonLayer;

        // Simplifiquei as bordas para exigir menos processamento de vídeo
        const estiloPadrao = { color: "#3388ff", weight: 1, fillOpacity: 0.2 };
        const estiloSelecionado = { color: "#ff1111", weight: 3, fillOpacity: 0.6 };

        fetch('talhoes.geojson')
            .then(response => {
                if (!response.ok) throw new Error("Cadê o arquivo talhoes.geojson?");
                return response.json();
            })
            .then(data => {
                document.getElementById('status-tabela').innerText = "Nenhum talhão selecionado.";
                const selectFazenda = document.getElementById('select-fazenda');
                selectFazenda.innerHTML = '<option value="">Localizar Fazenda no mapa...</option>';
                selectFazenda.disabled = false;

                geojsonLayer = L.geoJSON(data, {
                    style: estiloPadrao,
                    onEachFeature: function (feature, layer) {
                        const fazenda = feature.properties.fazenda || 'Sem Nome';
                        const talhao = feature.properties.talhao || 'S/N';

                        listaFazendas.add(fazenda);

                        // REMOVIDO o "permanent: true". 
                        // Agora o rótulo só aparece quando o tratorista (ou você) passar o mouse em cima.
                        layer.bindTooltip(`${fazenda} - ${talhao}`, {
                            direction: "center", 
                            className: 'bg-white bg-opacity-90 px-2 py-1 border border-gray-400 rounded text-sm font-bold text-black shadow'
                        });

                        layer.on('click', function () {
                            const idTalhao = fazenda + talhao;
                            
                            if(talhoesSelecionados.find(t => t.id === idTalhao)) return;

                            layer.setStyle(estiloSelecionado);

                            talhoesSelecionados.push({
                                id: idTalhao,
                                ordem: ordemSelecao,
                                fazenda: fazenda,
                                talhao: talhao
                            });

                            atualizarTabelaUI();
                            ordemSelecao++;
                        });
                    }
                }).addTo(map);

                map.fitBounds(geojsonLayer.getBounds());

                // Organizando as fazendas em ordem alfabética porque somos civilizados
                Array.from(listaFazendas).sort().forEach(fazenda => {
                    let option = document.createElement('option');
                    option.value = fazenda;
                    option.text = fazenda;
                    selectFazenda.appendChild(option);
                });
            })
            .catch(error => {
                console.error(error);
                document.getElementById('status-tabela').innerText = "Erro ao carregar dados. Verifique o console.";
            });

        document.getElementById('select-fazenda').addEventListener('change', function(e) {
            const fazendaAlvo = e.target.value;
            if(!fazendaAlvo || !geojsonLayer) return;

            const boundsFazenda = L.featureGroup();
            geojsonLayer.eachLayer(function(layer) {
                if (layer.feature.properties.fazenda === fazendaAlvo) {
                    boundsFazenda.addLayer(layer);
                }
            });

            if (boundsFazenda.getLayers().length > 0) {
                map.fitBounds(boundsFazenda.getBounds(), { padding: [50, 50] });
            }
        });

        function atualizarTabelaUI() {
            const tbody = document.getElementById('tabela-selecao');
            tbody.innerHTML = ''; 
            
            talhoesSelecionados.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-100 transition-colors";
                tr.innerHTML = `
                    <td class="px-2 py-2 font-bold text-blue-700"># ${item.ordem}</td>
                    <td class="px-2 py-2 font-semibold text-gray-800">${item.fazenda}</td>
                    <td class="px-2 py-2 text-gray-600">${item.talhao}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function limparSelecao() {
            talhoesSelecionados = [];
            ordemSelecao = 1;
            if(geojsonLayer) geojsonLayer.setStyle(estiloPadrao);
            
            const tabela = document.getElementById('tabela-selecao');
            if(tabela) {
                tabela.innerHTML = '<tr><td colspan="3" class="px-2 py-4 text-gray-500 italic text-center">Nenhum talhão selecionado.</td></tr>';
            }
        }

        function gerarPDF() {
            if(talhoesSelecionados.length === 0) {
                alert("Imprimir o vazio é inútil. Selecione um talhão.");
                return;
            }

            const elementoInteiro = document.getElementById('area-de-impressao');
            
            const opt = {
                margin:       0,
                filename:     'relatorio_controle_agricola.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, logging: false },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
            };

            const btn = document.querySelector('button[onclick="gerarPDF()"]');
            const textoOriginal = btn.innerText;
            btn.innerText = "Gerando PDF...";
            btn.disabled = true;

            html2pdf().set(opt).from(elementoInteiro).save().then(() => {
                btn.innerText = textoOriginal;
                btn.disabled = false;
            }).catch(err => {
                alert("Erro ao renderizar o PDF.");
                btn.innerText = textoOriginal;
                btn.disabled = false;
            });
        }
    </script>

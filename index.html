<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório Controle Agricola - Gestão de Talhões</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="talhoes.js"></script>

    <style>
        #map { height: 100%; width: 100%; z-index: 1; }
        .esconder-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-100 h-screen font-sans overflow-hidden">
    <div id="area-de-impressao" class="flex h-full w-full bg-white">
        
        <aside class="w-1/3 bg-white shadow-xl flex flex-col z-10 border-r border-gray-300" id="sidebar">
            <div class="p-6 bg-blue-900 text-white">
                <h1 class="text-2xl font-bold">Relatório Controle Agricola</h1>
                <p class="text-sm opacity-80">Ordem de seleção das áreas</p>
            </div>
            
            <div class="p-4 bg-gray-50 border-b border-gray-200" data-html2canvas-ignore>
                <label class="block text-sm font-bold text-gray-700 mb-2">Ações e Filtros</label>
                <select id="select-fazenda" class="w-full p-2 mb-3 border rounded shadow-sm focus:ring-blue-500">
                    <option value="">Todas as Fazendas (Mostrar Tudo)</option>
                </select>
                <button onclick="gerarPDF()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded shadow">
                    Imprimir Relatório (PDF 2+ Páginas)
                </button>
                <button onclick="limparSelecao()" class="w-full bg-red-100 hover:bg-red-200 text-red-700 font-semibold py-1 px-4 rounded shadow mt-2">
                    Limpar Tudo
                </button>
            </div>

            <div class="p-4 flex-1 overflow-y-auto esconder-scroll" id="container-tabela">
                <h2 class="text-lg font-bold mb-4 text-gray-800 border-b pb-2">Sequência de Operação</h2>
                <div class="overflow-x-auto">
                    <table class="min-w-full text-left text-sm whitespace-nowrap">
                        <thead class="uppercase tracking-wider border-b-2 border-gray-800 bg-gray-50">
                            <tr>
                                <th scope="col" class="px-2 py-3">Ordem</th>
                                <th scope="col" class="px-2 py-3">Fazenda</th>
                                <th scope="col" class="px-2 py-3">Talhão</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-selecao" class="divide-y divide-gray-200">
                            <tr>
                                <td colspan="3" class="px-2 py-4 text-gray-500 italic text-center">Nenhum talhão selecionado.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </aside>

        <main class="w-2/3 relative h-full" id="map-area">
            <div id="map"></div>
        </main>
    </div>

    <script>
        const map = L.map('map', { preferCanvas: true }).setView([-15.7801, -47.9292], 5);

        L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            maxZoom: 20, crossOrigin: true, attribution: '© Google Maps'
        }).addTo(map);

        let ordemSelecao = 1;
        let talhoesSelecionados = [];
        let listaFazendas = new Set();
        let geojsonLayer;

        const estiloPadrao = { color: "#3388ff", weight: 1, fillOpacity: 0.2, opacity: 1 };
        const estiloApagado = { color: "#999999", weight: 1, fillOpacity: 0.05, opacity: 0.3 };
        const estiloInvisivel = { color: "transparent", weight: 0, fillOpacity: 0, opacity: 0 };
        const estiloSelecionado = { color: "#ff1111", weight: 3, fillOpacity: 0.6, opacity: 1 };

        if (typeof meusTalhoes === 'undefined') {
            alert("Erro: Arquivo JS não carregou.");
        } else {
            geojsonLayer = L.geoJSON(meusTalhoes, {
                style: estiloPadrao,
                onEachFeature: function (feature, layer) {
                    let propFazenda = Object.keys(feature.properties).find(k => k.toLowerCase().includes('fazenda'));
                    let propTalhao = Object.keys(feature.properties).find(k => k.toLowerCase().includes('talhao') || k.toLowerCase().includes('talh'));

                    const fazenda = propFazenda ? feature.properties[propFazenda] : 'Desconhecida';
                    const talhao = propTalhao ? feature.properties[propTalhao] : 'S/N';
                    const idTalhao = fazenda + "-" + talhao;

                    feature.properties._nomeFazenda = fazenda;
                    feature.properties._idInterno = idTalhao;

                    listaFazendas.add(fazenda);

                    layer.bindTooltip(`${fazenda} - ${talhao}`, {
                        direction: "center", className: 'bg-white bg-opacity-90 px-2 py-1 border border-gray-400 rounded text-sm font-bold shadow'
                    });

                    layer.on('click', function () {
                        if(talhoesSelecionados.find(t => t.id === idTalhao)) return;
                        
                        layer.setStyle(estiloSelecionado);
                        talhoesSelecionados.push({ id: idTalhao, ordem: ordemSelecao, fazenda: fazenda, talhao: talhao });
                        atualizarTabelaUI();
                        ordemSelecao++;
                    });
                }
            }).addTo(map);

            map.fitBounds(geojsonLayer.getBounds());

            const selectFazenda = document.getElementById('select-fazenda');
            Array.from(listaFazendas).sort().forEach(fazenda => {
                let option = document.createElement('option');
                option.value = fazenda;
                option.text = fazenda;
                selectFazenda.appendChild(option);
            });
        }

        document.getElementById('select-fazenda').addEventListener('change', function(e) {
            const fazendaAlvo = e.target.value;
            if(!geojsonLayer) return;

            if(!fazendaAlvo) {
                restaurarVisualMapa();
                map.fitBounds(geojsonLayer.getBounds());
                return;
            }

            const boundsFazenda = L.featureGroup();
            geojsonLayer.eachLayer(function(layer) {
                const isSelecionado = talhoesSelecionados.find(t => t.id === layer.feature.properties._idInterno);
                if (layer.feature.properties._nomeFazenda === fazendaAlvo) {
                    boundsFazenda.addLayer(layer);
                    if (!isSelecionado) layer.setStyle(estiloPadrao);
                } else {
                    if (!isSelecionado) layer.setStyle(estiloApagado);
                }
            });

            if (boundsFazenda.getLayers().length > 0) {
                map.fitBounds(boundsFazenda.getBounds(), { padding: [50, 50] });
            }
        });

        function atualizarTabelaUI() {
            const tbody = document.getElementById('tabela-selecao');
            tbody.innerHTML = ''; 
            talhoesSelecionados.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-100 transition-colors";
                tr.innerHTML = `
                    <td class="px-2 py-2 font-bold text-blue-700"># ${item.ordem}</td>
                    <td class="px-2 py-2 font-semibold text-gray-800">${item.fazenda}</td>
                    <td class="px-2 py-2 text-gray-600">${item.talhao}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function limparSelecao() {
            talhoesSelecionados = [];
            ordemSelecao = 1;
            document.getElementById('select-fazenda').value = "";
            restaurarVisualMapa();
            document.getElementById('tabela-selecao').innerHTML = '<tr><td colspan="3" class="px-2 py-4 text-gray-500 italic text-center">Nenhum talhão selecionado.</td></tr>';
        }

        function restaurarVisualMapa() {
            if(!geojsonLayer) return;
            geojsonLayer.eachLayer(function(layer) {
                if (talhoesSelecionados.find(t => t.id === layer.feature.properties._idInterno)) {
                    layer.setStyle(estiloSelecionado);
                } else {
                    layer.setStyle(estiloPadrao);
                }
            });
        }

        // ==========================================
        // GERADOR DE PDF: MODO 2 PÁGINAS (RETRATO)
        // ==========================================
        function gerarPDF() {
            if(talhoesSelecionados.length === 0) return alert("Selecione um talhão primeiro.");
            
            const btn = document.querySelector('button[onclick="gerarPDF()"]');
            const textoOriginal = btn.innerText; 
            btn.innerText = "Transformando Layout..."; 
            btn.disabled = true;

            // 1. Apaga os talhões não selecionados do mapa
            const boundsSelecionados = L.featureGroup();
            geojsonLayer.eachLayer(function(layer) {
                if (talhoesSelecionados.find(t => t.id === layer.feature.properties._idInterno)) {
                    boundsSelecionados.addLayer(layer);
                } else {
                    layer.setStyle(estiloInvisivel);
                }
            });

            // 2. Elementos que vamos hackear
            const areaImpressao = document.getElementById('area-de-impressao');
            const sidebar = document.getElementById('sidebar');
            const mapArea = document.getElementById('map-area');
            const containerTabela = document.getElementById('container-tabela');

            // 3. Salva os estilos originais para podermos arrumar a bagunça depois
            const classAreaOrig = areaImpressao.className;
            const classSidebarOrig = sidebar.className;
            const classMapOrig = mapArea.className;
            const classContainerTabelaOrig = containerTabela.className;

            // 4. Quebra o Layout: Tira o Lado-a-Lado e põe em blocos
            areaImpressao.className = "w-full bg-white block"; // block no lugar do flex
            sidebar.className = "w-full bg-white"; // Tabela pega 100% da largura
            containerTabela.className = "p-4"; // Tira o "overflow-y-auto" pra tabela crescer até o fim
            mapArea.className = "w-full relative mt-4"; // Mapa pega 100% da largura
            
            // Força o mapa a ter uma altura compatível com uma folha A4 em retrato (297mm)
            mapArea.style.height = "260mm"; 

            // 5. Injeta a quebra de página mágica do html2pdf
            const pageBreak = document.createElement('div');
            pageBreak.className = "html2pdf__page-break";
            sidebar.after(pageBreak);

            // 6. Manda o Leaflet recalcular o tamanho e dar o zoom nos selecionados
            map.invalidateSize();
            map.fitBounds(boundsSelecionados.getBounds(), { padding: [40, 40] });

            // Dá 800ms pro Google Maps carregar as imagens na nova resolução gigante
            setTimeout(() => {
                btn.innerText = "Gerando as páginas...";
                
                const opt = {
                    margin: 10, 
                    filename: 'relatorio_controle_agricola.pdf', 
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true, logging: false }, 
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } // Agora é retrato!
                };
                
                html2pdf().set(opt).from(areaImpressao).save().then(() => { 
                    // 7. RESTAURA TUDO PARA O USUÁRIO NÃO PERCEBER O HACK
                    pageBreak.remove();
                    areaImpressao.className = classAreaOrig;
                    sidebar.className = classSidebarOrig;
                    mapArea.className = classMapOrig;
                    containerTabela.className = classContainerTabelaOrig;
                    mapArea.style.height = ""; // Tira a altura fixa
                    
                    map.invalidateSize(); // Recalcula o mapa de volta pro tamanho original
                    restaurarVisualMapa();
                    
                    const fazendaFiltro = document.getElementById('select-fazenda').value;
                    if(fazendaFiltro) {
                        document.getElementById('select-fazenda').dispatchEvent(new Event('change'));
                    } else {
                        map.fitBounds(geojsonLayer.getBounds());
                    }

                    btn.innerText = textoOriginal; 
                    btn.disabled = false; 
                }).catch(err => { 
                    alert("Erro absurdo ao renderizar o PDF. A culpa é do JavaScript."); 
                    console.error(err);
                    
                    // Restaura mesmo dando erro pra tela não ficar morta
                    pageBreak.remove();
                    areaImpressao.className = classAreaOrig;
                    sidebar.className = classSidebarOrig;
                    mapArea.className = classMapOrig;
                    containerTabela.className = classContainerTabelaOrig;
                    mapArea.style.height = "";
                    map.invalidateSize();
                    restaurarVisualMapa();

                    btn.innerText = textoOriginal; 
                    btn.disabled = false; 
                });
            }, 800); 
        }
    </script>
</body>
</html>
